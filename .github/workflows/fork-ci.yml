name: Fork CI

# Slim CI for Git-on-my-level/hermes-agent. Upstream's orchestrator (ci.yaml)
# targets ubuntu-latest-96-core and a pile of OS/docs/nix/docker lanes this
# fork does not have. This file is additive keep-list content — do not edit
# ci.yaml. After an upstream sync, run scripts/fork_ci_apply.sh so newly
# added standalone workflows stay disabled.
#
# Full upstream CI still runs on NousResearch/hermes-agent; this workflow
# is a no-op there (see the job-level if).

on:
  pull_request:
  push:
    branches: [main, prod]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Python lints
    if: github.repository == 'Git-on-my-level/hermes-agent'
    uses: ./.github/workflows/lint.yml
    with:
      event_name: ${{ github.event_name }}

  tests:
    name: Python tests
    if: github.repository == 'Git-on-my-level/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ripgrep (prebuilt binary)
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web

      - name: Minimize uv cache
        run: uv cache prune --ci

      - name: Run tests
        run: |
          source .venv/bin/activate
          scripts/run_tests.sh
        env:
          HERMES_TEST_WORKERS: "4"
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  gate:
    name: All required checks pass
    needs: [lint, tests]
    if: always() && github.repository == 'Git-on-my-level/hermes-agent'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate
        env:
          LINT: ${{ needs.lint.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          echo "lint=$LINT tests=$TESTS"
          test "$LINT" = success
          test "$TESTS" = success
